<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="260" fill="#0A0A0F"/>

  <!-- rotating orbital ring for depth -->
  <g>
    <ellipse cx="450" cy="130" rx="110" ry="38" fill="none" stroke="#7B5FFF" stroke-width="1" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0 450 130" to="360 450 130" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="130" rx="150" ry="55" fill="none" stroke="#00D9FF" stroke-width="0.75" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="360 450 130" to="0 450 130" dur="26s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- connecting lines -->
  <line x1="450" y1="130" x2="180" y2="60" stroke="#1E1E2A" stroke-width="1.5"/>
  <line x1="450" y1="130" x2="180" y2="200" stroke="#1E1E2A" stroke-width="1.5"/>
  <line x1="450" y1="130" x2="720" y2="60" stroke="#1E1E2A" stroke-width="1.5"/>
  <line x1="450" y1="130" x2="720" y2="200" stroke="#1E1E2A" stroke-width="1.5"/>
  <line x1="450" y1="130" x2="450" y2="40" stroke="#1E1E2A" stroke-width="1.5"/>
  <line x1="450" y1="130" x2="450" y2="220" stroke="#1E1E2A" stroke-width="1.5"/>

  <!-- center node with pulse -->
  <circle cx="450" cy="130" r="26" fill="#0A0A0F" stroke="#7B5FFF" stroke-width="2"/>
  <circle cx="450" cy="130" r="26" fill="none" stroke="#7B5FFF" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="26;36;26" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="134" font-family="Consolas, monospace" font-size="10" fill="#7B5FFF" text-anchor="middle">CORE</text>

  <!-- outer nodes -->
  <circle cx="180" cy="60" r="20" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="180" y="30" font-family="Consolas, monospace" font-size="12" fill="#F5F5F7" text-anchor="middle">Machine Learning</text>

  <circle cx="180" cy="200" r="20" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="180" y="238" font-family="Consolas, monospace" font-size="12" fill="#F5F5F7" text-anchor="middle">RAG</text>

  <circle cx="720" cy="60" r="20" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="720" y="30" font-family="Consolas, monospace" font-size="12" fill="#F5F5F7" text-anchor="middle">NLP</text>

  <circle cx="720" cy="200" r="20" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="720" y="238" font-family="Consolas, monospace" font-size="12" fill="#F5F5F7" text-anchor="middle">Generative AI</text>

  <circle cx="450" cy="40" r="20" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="450" y="14" font-family="Consolas, monospace" font-size="12" fill="#F5F5F7" text-anchor="middle">Agents</text>

  <circle cx="450" cy="220" r="20" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="450" y="250" font-family="Consolas, monospace" font-size="12" fill="#F5F5F7" text-anchor="middle">Predictive Analytics</text>
</svg>
