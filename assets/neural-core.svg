<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="480" fill="#0A0A0F"/>

  <g>
    <ellipse cx="450" cy="240" rx="200" ry="200" fill="none" stroke="#7B5FFF" stroke-width="0.6" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0 450 240" to="360 450 240" dur="24s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="240" rx="250" ry="140" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.18">
      <animateTransform attributeName="transform" type="rotate" from="360 450 240" to="0 450 240" dur="32s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <line x1="450" y1="240" x2="200" y2="120" stroke="#1E1E2A" stroke-width="1"/>
  <line x1="450" y1="240" x2="200" y2="360" stroke="#1E1E2A" stroke-width="1"/>
  <line x1="450" y1="240" x2="700" y2="120" stroke="#1E1E2A" stroke-width="1"/>
  <line x1="450" y1="240" x2="700" y2="360" stroke="#1E1E2A" stroke-width="1"/>
  <line x1="450" y1="240" x2="450" y2="70" stroke="#1E1E2A" stroke-width="1"/>
  <line x1="450" y1="240" x2="450" y2="410" stroke="#1E1E2A" stroke-width="1"/>

  <circle cx="450" cy="240" r="46" fill="#0A0A0F" stroke="#7B5FFF" stroke-width="2"/>
  <circle cx="450" cy="240" r="46" fill="none" stroke="#7B5FFF" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="46;60;46" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="245" font-family="Consolas, monospace" font-size="13" fill="#7B5FFF" text-anchor="middle">CORE</text>

  <circle cx="200" cy="120" r="30" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="200" y="126" font-family="Consolas, monospace" font-size="12" fill="#F5F5F7" text-anchor="middle">ML</text>
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="13" fill="#8B8B96" text-anchor="middle">Machine Learning</text>

  <circle cx="200" cy="360" r="30" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="200" y="366" font-family="Consolas, monospace" font-size="12" fill="#F5F5F7" text-anchor="middle">RAG</text>
  <text x="200" y="410" font-family="Arial, sans-serif" font-size="13" fill="#8B8B96" text-anchor="middle">Retrieval-Augmented Gen</text>

  <circle cx="700" cy="120" r="30" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="700" y="126" font-family="Consolas, monospace" font-size="12" fill="#F5F5F7" text-anchor="middle">NLP</text>
  <text x="700" y="80" font-family="Arial, sans-serif" font-size="13" fill="#8B8B96" text-anchor="middle">Natural Language</text>

  <circle cx="700" cy="360" r="30" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="700" y="366" font-family="Consolas, monospace" font-size="11" fill="#F5F5F7" text-anchor="middle">GenAI</text>
  <text x="700" y="410" font-family="Arial, sans-serif" font-size="13" fill="#8B8B96" text-anchor="middle">Generative AI</text>

  <circle cx="450" cy="70" r="30" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="450" y="76" font-family="Consolas, monospace" font-size="11" fill="#F5F5F7" text-anchor="middle">Agents</text>
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="13" fill="#8B8B96" text-anchor="middle">Multi-Agent Systems</text>

  <circle cx="450" cy="410" r="30" fill="#0A0A0F" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="450" y="416" font-family="Consolas, monospace" font-size="10" fill="#F5F5F7" text-anchor="middle">Predict</text>
  <text x="450" y="450" font-family="Arial, sans-serif" font-size="13" fill="#8B8B96" text-anchor="middle">Predictive Analytics</text>
</svg>
